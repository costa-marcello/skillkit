name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # ADAPT: For yarn, change cache to 'yarn'
          # ADAPT: For pnpm, remove cache here and use pnpm/action-setup instead (see below)
          # ADAPT: For Bun, use oven-sh/setup-bun@v2 instead of actions/setup-node@v6

      # ADAPT: Uncomment for pnpm:
      # - name: Setup pnpm
      #   uses: pnpm/action-setup@v4
      #   with:
      #     version: 9

      # ADAPT: Uncomment for Bun:
      # - name: Setup Bun
      #   uses: oven-sh/setup-bun@v2
      #   with:
      #     bun-version: latest

      - name: Install dependencies
        run: npm ci
        # ADAPT: For yarn, use: yarn install --frozen-lockfile
        # ADAPT: For pnpm, use: pnpm install --frozen-lockfile
        # ADAPT: For Bun, use: bun install --frozen-lockfile

      - name: Lint code
        run: npm run lint
        # ADAPT: For yarn/pnpm/Bun, replace npm with yarn/pnpm/bun

      - name: Run tests
        run: npm test
        # ADAPT: For yarn/pnpm, replace npm with yarn/pnpm
        # ADAPT: For Bun, use: bun test

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          fail_ci_if_error: false
