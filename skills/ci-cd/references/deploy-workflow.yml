name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ADAPT: For Amazon ECR, replace this step with:
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v5
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1
      # - name: Login to Amazon ECR
      #   uses: aws-actions/amazon-ecr-login@v2

      # ADAPT: For Docker Hub, replace registry/username in this step:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ADAPT: For Google Artifact Registry, replace this step with:
      # - name: Authenticate to Google Cloud
      #   uses: google-github-actions/auth@v3
      #   with:
      #     credentials_json: ${{ secrets.GCP_SA_KEY }}
      # - name: Configure Docker for GAR
      #   run: gcloud auth configure-docker us-docker.pkg.dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # ADAPT: Change registry and image name as needed
          # For ECR: <aws-account-id>.dkr.ecr.<region>.amazonaws.com/<repo-name>
          # For Docker Hub: <dockerhub-username>/<repo-name>
          # For GAR: <region>-docker.pkg.dev/<project-id>/<repo-name>/<image-name>
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ADAPT: Add platform if needed for multi-arch builds:
          # platforms: linux/amd64,linux/arm64
